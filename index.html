﻿<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Burger House - Próximamente</title>
    <link rel="icon" href="logobh.webp" type="image/webp">
    
    <!-- Fuentes sincronizadas con el App ADN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>

    <style>
        :root {
            --primary-color: #e60000;
            --bg-color: #080808;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Montserrat', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* Estilo para el video de fondo que reemplaza la imagen anterior */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(6px) brightness(0.6);
            z-index: -2;
        }

        /* Contenedor compacto estilo App (Max 400px) */
        .app-shell {
            max-width: 400px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 40px 10px;
        }

        /* Tarjeta de Texto con Glassmorphism */
        .text-card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; /* Sincronizado con bloques del contador */
            padding: 20px 15px;
            width: 95%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Logo sutil (ADN Navigation) */
        .logo-header {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px rgba(230, 0, 0, 0.3));
            animation: latido 3s ease-in-out infinite;
        }

        @keyframes latido {
            0%, 100% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1); opacity: 1; }
        }

        .text-card h1 {
            font-family: var(--font-heading);
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 8px;
        }

        .subtitle {
            font-weight: 500;
            font-size: 0.9rem;
            line-height: 1.6;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Contador Minimalista y Compacto */
        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            margin: 10px 0;
        }

        .count-block {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; /* ADN: Bordes limpios */
            padding: 10px 5px;
        }

        .count-number {
            display: block;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--primary-color);
            line-height: 1;
        }

        .count-label {
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Botón de Acción Premium (ADN index.html) */
        .btn-action {
            width: 85%;
            background: linear-gradient(180deg, #8b0000 0%, #ff0000 100%);
            color: white;
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px;
            border-radius: 30px; /* ADN: Redondeado App */
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

    </style>
</head>
<body>
    <!-- Video de fondo optimizado -->
    <video autoplay muted loop playsinline preload="auto" webkit-playsinline class="video-background" poster="assets/videos/comingsoon.jpg">
        <source src="assets/videos/comingsoon.mp4" type="video/mp4">
    </video>

    <div class="app-shell">
        <!-- Texto de Impacto (La Broma) -->
        <div class="text-card">
            <h1 style="color: white;">¿EN SERIO TE LO CREÍSTE?</h1>
            <p class="subtitle">No caigas en trampas... Prepárate para lo que de verdad se viene.</p>
        </div>

        <!-- Contador Regresivo -->
        <div class="countdown-container" id="timer">
            <div class="count-block"><span class="count-number" id="d">00</span><span class="count-label">Días</span></div>
            <div class="count-block"><span class="count-number" id="h">00</span><span class="count-label">Hrs</span></div>
            <div class="count-block"><span class="count-number" id="m">00</span><span class="count-label">Min</span></div>
            <div class="count-block"><span class="count-number" id="s">00</span><span class="count-label">Seg</span></div>
        </div>

        <!-- Identidad de la Marca -->
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 8px;">
            <img src="logobh.webp" alt="Burger House" class="logo-header">
            <h2 style="font-family: var(--font-heading); font-weight: 800; font-size: 1.8rem; letter-spacing: 2px; text-transform: uppercase; color: white;">BURGER HOUSE</h2>
        </div>
    </div>

    <script>
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyCOIK3Xc_IzKvDc1hmO5aAdLST0KE8f9P8",
            authDomain: "burguer-house-17e76.firebaseapp.com",
            databaseURL: "https://burguer-house-17e76-default-rtdb.firebaseio.com",
            projectId: "burguer-house-17e76",
            storageBucket: "burguer-house-17e76.firebasestorage.app",
            messagingSenderId: "641974770181",
            appId: "1:641974770181:web:5e348815b735d26cb7da6c",
            measurementId: "G-YBR4MCPDXQ"
        };

        // Inicializar Firebase
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
            
            // Inicializar Firebase Analytics
            if (typeof firebase.analytics !== 'undefined') {
                firebase.analytics();
                console.log("✅ Firebase Analytics inicializado correctamente.");
            } else {
                console.warn("⚠️ Firebase Analytics no está disponible.");
            }
        } else {
            console.error("❌ Firebase SDK no está cargado.");
        }

        // Script de Fuerza Bruta para Autoplay en Móviles (Android e iOS)
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('.video-background');
            if (!video) return;

            const iniciarVideo = () => {
                video.muted = true;
                video.playsInline = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('webkit-playsinline', '');
                video.playbackRate = 0.7; // Video más lento (70% de velocidad normal)
                
                video.play()
                    .then(() => {
                        console.log("✅ Video de fondo iniciado correctamente.");
                        // Remover event listeners después del éxito
                        document.removeEventListener('click', iniciarVideo);
                        document.removeEventListener('touchstart', iniciarVideo);
                        document.removeEventListener('touchend', iniciarVideo);
                        document.removeEventListener('scroll', iniciarVideo);
                        document.removeEventListener('visibilitychange', iniciarVideo);
                    })
                    .catch(error => {
                        console.error("❌ Autoplay bloqueado por el navegador:", error.message);
                    });
            };

            // Intentar autoplay inicial
            video.currentTime = 0;
            iniciarVideo();

            // Múltiples eventos para forzar reproducción en móviles
            document.addEventListener('click', iniciarVideo, { once: true });
            document.addEventListener('touchstart', iniciarVideo, { once: true });
            document.addEventListener('touchend', iniciarVideo, { once: true });
            document.addEventListener('scroll', iniciarVideo, { once: true });
            
            // Cuando la página vuelve a estar visible
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && video.paused) {
                    iniciarVideo();
                }
            });
        });

        const launch = new Date("2026-06-15T17:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = launch - now;
            if (diff < 0) {
                document.getElementById("timer").innerHTML = `<p style='grid-column: span 4; font-family: var(--font-heading); font-weight: 800; color: var(--primary-color);'>¡YA ESTAMOS ABIERTOS!</p>`;
                return;
            }
            document.getElementById("d").innerText = Math.floor(diff / (864e5)).toString().padStart(2, '0');
            document.getElementById("h").innerText = Math.floor((diff % 864e5) / 36e5).toString().padStart(2, '0');
            document.getElementById("m").innerText = Math.floor((diff % 36e5) / 6e4).toString().padStart(2, '0');
            document.getElementById("s").innerText = Math.floor((diff % 6e4) / 1e3).toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
