<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Burger House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 100%);
            min-height: 100vh;
        }
        
        .card-glow {
            box-shadow: 0 4px 20px rgba(230, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        .card-glow:hover {
            box-shadow: 0 6px 30px rgba(230, 0, 0, 0.25);
            transform: translateY(-2px);
        }
        
        .btn-approve {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            transition: all 0.3s ease;
        }
        
        .btn-approve:hover {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            transform: scale(1.02);
        }
        
        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #e60000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="logobh.webp" alt="Burger House" class="w-16 h-16 rounded-full">
                    <div>
                        <h1 class="text-3xl font-bold text-red-500">Panel de Administración</h1>
                        <p class="text-gray-400 text-sm">Burger House - Pedidos Pendientes</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-sm text-gray-400">Conectado en tiempo real</span>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-gray-900/50 backdrop-blur-sm rounded-xl p-6 border border-gray-800">
                <p class="text-gray-400 text-sm mb-1">Pedidos Pendientes</p>
                <p id="pending-count" class="text-4xl font-bold text-red-500">0</p>
            </div>
            <div class="bg-gray-900/50 backdrop-blur-sm rounded-xl p-6 border border-gray-800">
                <p class="text-gray-400 text-sm mb-1">Última Actualización</p>
                <p id="last-update" class="text-lg font-semibold text-white">--:--:--</p>
            </div>
            <div class="bg-gray-900/50 backdrop-blur-sm rounded-xl p-6 border border-gray-800">
                <p class="text-gray-400 text-sm mb-1">Estado del Sistema</p>
                <p class="text-lg font-semibold text-green-500">● Activo</p>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-400">Cargando pedidos...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20">
            <svg class="w-24 h-24 text-gray-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <p class="text-gray-400 text-lg">No hay pedidos pendientes</p>
            <p class="text-gray-600 text-sm mt-2">Los nuevos pedidos aparecerán aquí automáticamente</p>
        </div>

        <!-- Orders Container -->
        <div id="orders-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Las tarjetas de pedidos se renderizarán aquí -->
        </div>
    </div>

    <script>
        // Configuración de Firebase (misma que app.js)
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyCOIK3Xc_IzKvDc1hm05aAdLSt0KE8f9P8",
            authDomain: "burguer-house-17e76.firebaseapp.com",
            databaseURL: "https://burguer-house-17e76-default-rtdb.firebaseio.com",
            projectId: "burguer-house-17e76",
            storageBucket: "burguer-house-17e76.firebasestorage.app",
            messagingSenderId: "641974770181",
            appId: "1:641974770181:web:5e348815b735d26cb7da6c"
        };

        // Inicializar Firebase
        firebase.initializeApp(FIREBASE_CONFIG);
        const db = firebase.database();

        // Referencia al nodo de pedidos
        const pedidosRef = db.ref('pedidos');

        // Elementos del DOM
        const ordersContainer = document.getElementById('orders-container');
        const loadingElement = document.getElementById('loading');
        const emptyStateElement = document.getElementById('empty-state');
        const pendingCountElement = document.getElementById('pending-count');
        const lastUpdateElement = document.getElementById('last-update');

        // Función para renderizar una tarjeta de pedido
        function renderOrderCard(orderId, orderData) {
            const productosHTML = orderData.productos.map(prod => `
                <div class="flex justify-between items-center py-2 border-b border-gray-800 last:border-0">
                    <div>
                        <p class="font-medium text-white">${prod.nombre}</p>
                        <p class="text-xs text-gray-500">Cant: ${prod.cantidad} | $${prod.precio_unitario.toFixed(2)} c/u</p>
                        ${prod.detalles_personalizacion && prod.detalles_personalizacion.length > 0 ? `
                            <p class="text-xs text-gray-600 mt-1">
                                Extras: ${prod.detalles_personalizacion.map(d => `${d.nombre} (${d.opcion})`).join(', ')}
                            </p>
                        ` : ''}
                    </div>
                    <p class="font-semibold text-red-500">$${prod.subtotal.toFixed(2)}</p>
                </div>
            `).join('');

            const ubicacionHTML = orderData.ubicacion && orderData.ubicacion !== "N/A" ? `
                <div class="mt-3 p-3 bg-gray-800/50 rounded-lg">
                    <p class="text-xs text-gray-400 mb-1">📍 Ubicación:</p>
                    <a href="${orderData.ubicacion}" target="_blank" class="text-sm text-blue-400 hover:text-blue-300 underline">
                        Ver en Google Maps
                    </a>
                </div>
            ` : '';

            return `
                <div class="bg-gray-900/70 backdrop-blur-sm rounded-2xl p-6 border border-gray-800 card-glow">
                    <!-- Header de la tarjeta -->
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-white mb-1">${orderData.cliente}</h3>
                            <p class="text-sm text-gray-400">${orderData.fecha}</p>
                        </div>
                        <span class="px-3 py-1 bg-red-500/20 text-red-400 text-xs font-semibold rounded-full border border-red-500/30">
                            ${orderData.metodo.toUpperCase()}
                        </span>
                    </div>

                    <!-- Productos -->
                    <div class="mb-4">
                        <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Productos</p>
                        ${productosHTML}
                    </div>

                    <!-- Notas -->
                    ${orderData.notas && orderData.notas !== "Sin notas adicionales" ? `
                        <div class="mb-4 p-3 bg-yellow-500/10 rounded-lg border border-yellow-500/20">
                            <p class="text-xs text-yellow-400 mb-1">📝 Notas:</p>
                            <p class="text-sm text-gray-300">${orderData.notas}</p>
                        </div>
                    ` : ''}

                    <!-- Ubicación -->
                    ${ubicacionHTML}

                    <!-- Total y Botones -->
                    <div class="flex flex-col gap-3 mt-4 pt-4 border-t border-gray-800">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-xs text-gray-500">Total</p>
                                <p class="text-2xl font-bold text-red-500">$${orderData.total.toFixed(2)}</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="aprobarPedido('${orderId}')" class="btn-approve flex-1 px-4 py-3 rounded-xl font-semibold text-white shadow-lg">
                                ✓ Aprobar
                            </button>
                            <button onclick="eliminarPedido('${orderId}')" class="flex-1 px-4 py-3 rounded-xl font-semibold text-white shadow-lg bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 transition-all">
                                🗑️ Eliminar
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Función para aprobar pedido
        async function aprobarPedido(orderId) {
            try {
                // 1. Obtener los datos del pedido desde Firebase
                const snapshot = await db.ref('pedidos/' + orderId).once('value');
                const orderData = snapshot.val();

                if (!orderData) {
                    alert('Pedido no encontrado');
                    return;
                }

                // 2. Preparar datos para SheetDB con detalles de personalización
                const productosResumen = orderData.productos.map(prod => {
                    let detallesStr = '';
                    
                    if (prod.detalles_personalizacion && prod.detalles_personalizacion.length > 0) {
                        const extrasAgregados = [];
                        const ingredientesEliminados = [];
                        
                        prod.detalles_personalizacion.forEach(detalle => {
                            // Si es un toggle (SÍ/NO) y es "NO", es un ingrediente eliminado
                            if (detalle.opcion === 'NO' || detalle.opcion === 'no') {
                                ingredientesEliminados.push(detalle.nombre);
                            }
                            // Si tiene cantidad > 0, es un extra agregado
                            else if (detalle.cantidad > 0) {
                                extrasAgregados.push(`${detalle.nombre} (${detalle.cantidad})`);
                            }
                            // Si es un toggle "SÍ", también es un extra agregado
                            else if (detalle.opcion === 'SÍ' || detalle.opcion === 'sí') {
                                extrasAgregados.push(detalle.nombre);
                            }
                        });
                        
                        const partes = [];
                        if (extrasAgregados.length > 0) {
                            partes.push(`Extras: ${extrasAgregados.join(', ')}`);
                        }
                        if (ingredientesEliminados.length > 0) {
                            partes.push(`Sin: ${ingredientesEliminados.join(', ')}`);
                        }
                        
                        if (partes.length > 0) {
                            detallesStr = ` (${partes.join(' | ')})`;
                        }
                    }
                    
                    return `${prod.cantidad}x ${prod.nombre}${detallesStr}`;
                }).join(', ');

                const sheetDBData = {
                    data: [{
                        fecha: orderData.fecha,
                        cliente: orderData.cliente,
                        metodo: orderData.metodo,
                        productos: productosResumen,
                        total: orderData.total.toFixed(2),
                        notas: orderData.notas || "Sin notas adicionales",
                        ubicacion: orderData.ubicacion || "N/A"
                    }]
                };

                // 3. Enviar a SheetDB
                const response = await fetch('https://sheetdb.io/api/v1/qyjuou0mbnjhc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(sheetDBData)
                });

                if (!response.ok) {
                    throw new Error('Error en la respuesta de SheetDB');
                }

                // 4. Actualizar estado en Firebase a "aprobado"
                await db.ref('pedidos/' + orderId).update({
                    estado: 'aprobado'
                });

                console.log('Pedido aprobado exitosamente:', orderId);

            } catch (error) {
                console.error('Error al aprobar pedido:', error);
                alert('Error al conectar con Google Sheets. El pedido sigue pendiente');
                // NO cambiamos el estado en Firebase si falla SheetDB
            }
        }

        // Función para eliminar pedido
        async function eliminarPedido(orderId) {
            // Confirmación antes de eliminar
            if (!confirm('¿Estás seguro de que deseas eliminar este pedido? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                // Eliminar el pedido de Firebase
                await db.ref('pedidos/' + orderId).remove();
                console.log('Pedido eliminado exitosamente:', orderId);
                alert('Pedido eliminado correctamente');
            } catch (error) {
                console.error('Error al eliminar pedido:', error);
                alert('Error al eliminar el pedido. Por favor, intenta nuevamente.');
            }
        }

        // Escuchar cambios en tiempo real en el nodo pedidos
        pedidosRef.on('value', (snapshot) => {
            // Ocultar loading
            loadingElement.classList.add('hidden');
            
            const orders = snapshot.val();
            const pendingOrders = [];

            // Filtrar solo pedidos con estado "pendiente"
            if (orders) {
                Object.keys(orders).forEach(orderId => {
                    const order = orders[orderId];
                    if (order.estado === 'pendiente') {
                        pendingOrders.push({ id: orderId, ...order });
                    }
                });
            }

            // Actualizar contador
            pendingCountElement.textContent = pendingOrders.length;

            // Actualizar última actualización
            const now = new Date();
            lastUpdateElement.textContent = now.toLocaleTimeString();

            // Mostrar empty state si no hay pedidos
            if (pendingOrders.length === 0) {
                emptyStateElement.classList.remove('hidden');
                ordersContainer.innerHTML = '';
                return;
            }

            // Ocultar empty state y renderizar pedidos
            emptyStateElement.classList.add('hidden');
            
            // Ordenar por timestamp (más reciente primero)
            pendingOrders.sort((a, b) => b.timestamp - a.timestamp);

            // Renderizar tarjetas
            ordersContainer.innerHTML = pendingOrders.map(order => 
                renderOrderCard(order.id, order)
            ).join('');
        }, (error) => {
            console.error('Error al escuchar pedidos:', error);
            loadingElement.innerHTML = `
                <div class="text-red-500">
                    <p class="text-lg font-semibold">Error al cargar pedidos</p>
                    <p class="text-sm text-gray-400 mt-2">${error.message}</p>
                </div>
            `;
        });
    </script>
</body>
</html>
